[project]
name = "pleskal"
version = "0.1.0"
description = "A web application for a Copenhagen dance and perofmance arts event calendar."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "psycopg[binary]>=3.3.4",
    "django-markdownx>=4.0.11",
    "nh3>=0.3.6",
    "django-storages[boto3]>=1.14.6",
    "django-axes>=8.3.1",
    "django-environ>=0.14.0",
    "pillow>=12.3.0",
    "gunicorn>=26.1.0",
    "sentry-sdk[django]>=2.68.0",
    "whitenoise>=6.12.0",
    "icalendar>=7.3.0",
    "zxcvbn>=4.5.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.2",
    "django-anymail[resend]>=15.1",
    "markdownify>=1.2.3",
    "django-allauth>=65.19.1",
    "argon2-cffi>=25.1.0",
    "resend>=2.37.0",
    "pillow-heif>=1.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-cov>=7.1.0",
    "factory-boy>=3.3.3",
    "django-debug-toolbar>=7.1.1",
    "ty>=0.0.73",
    "pre-commit>=4.6.2",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors: style and syntax violations
    "F",   # Pyflakes: undefined names, unused imports, and other logical errors
    "I",   # isort: enforce consistent import ordering
    "UP",  # pyupgrade: modernize Python syntax for newer language versions
    "B",   # flake8-bugbear: catch likely bugs and opinionated design problems
    "SIM", # flake8-simplify: suggest simplifications to existing code constructs
    "S",   # flake8-bandit: detect common security vulnerabilities
]
ignore = [
    "E501", # line too long: not enforced, handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = [
    "S101", # assert: assert statements are idiomatic and expected in tests
    "S106", # hardcoded-password-func-arg: literal passwords are routine in test fixtures
    "S314", # suspicious-xml-element-tree-usage: parsing trusted test response data, not user input
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db -n 8"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]
relative_files = true
